name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >-
            shiny, ggplot2, plotly, dplyr, tidyr, readr, DT, scales

      - name: Run the app's test suite
        run: Rscript tests/test_app.R
